[project]
name = "mlops-health-service"
version = "0.1.0"
description = "Оценка загруженности дороги по аэроснимку: первый этап — веб-приложение"
authors = [
    { name = "theJorDea", email = "klevin3701@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]
readme = "README.md"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "health"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.uv]
default-groups = ["web", "dev"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
eda = [
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
]
train = [
    "mlflow>=3.18.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "ultralytics>=8.4.203",
]
web = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "BLE", # flake8-blind-except: запрещает except Exception без уважительной причины
    "ANN", # flake8-annotations
]
ignore = [
    "RUF001", # кириллические строки — ложные срабатывания
    "RUF002", # кириллические docstring — ложные срабатывания
    "RUF003", # кириллические комментарии — ложные срабатывания
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # аннотации в тестах не несут контракта

[tool.ruff.lint.isort]
known-first-party = ["health"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=health --cov-report=term-missing"
markers = ["integration: реальные Docker Compose, PostgreSQL и HTTP"]
