
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # для отправки Git-тегов на v*
  pull_request:
    branches: [main] # при создании, обновлении или синхронизации PR в ветку main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Unit tests and coverage
        run: uv run --locked pytest -m "not integration"

  integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run --locked pytest -m integration
