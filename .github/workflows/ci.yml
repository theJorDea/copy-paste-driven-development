
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # для отправки Git-тегов на v*
  pull_request:
    branches: [main] # при создании, обновлении или синхронизации PR в ветку main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Unit tests and coverage
        run: uv run --locked pytest -m "not integration"

  integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run --locked pytest -m integration

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest

    needs: [quality, integration]

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
