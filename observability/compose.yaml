services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m
    networks: [mlops-network]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 128m
    networks: [mlops-network]

  pushgateway:
    image: prom/pushgateway:v1.11.1
    profiles: [observability]
    ports: ["127.0.0.1:9091:9091"]
    mem_limit: 128m
    networks: [mlops-network]

  loki:
    image: grafana/loki:3.5.5
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 512m
    networks: [mlops-network]

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:3200:3200"]
    mem_limit: 512m
    networks: [mlops-network]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    mem_limit: 256m
    depends_on: [tempo]
    networks: [mlops-network]

  alloy:
    image: grafana/alloy:v1.11.0
    profiles: [observability]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    depends_on: [loki]
    networks: [mlops-network]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [observability]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose: ["8080"]
    mem_limit: 256m
    networks: [mlops-network]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 512m
    depends_on: [prometheus, loki, tempo]
    networks: [mlops-network]

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:

networks:
  mlops-network:
    name: copy-paste-driven-development-main_mlops-network
