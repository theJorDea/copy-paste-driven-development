global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: development
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["app:8000"]}]
    metrics_path: /metrics
  - job_name: workers
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs: [{targets: ["rabbitmq:15692"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
