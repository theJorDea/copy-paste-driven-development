
name: mlflow-lab

services:
  # Backend Store
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?Database password required}
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Artifact Store
  storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SERVER_DOMAINS: "storage:9000"
      RUSTFS_REGION: "us-east-1"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3 access key required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3 secret key required}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:9000/health | grep -q ''"status":"ok"'''
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  create-bucket:
    image: amazon/aws-cli:2.33.25
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket mlflow-artifacts >/dev/null 2>&1 ||
        aws --endpoint-url http://storage:9000 s3api create-bucket --bucket mlflow-artifacts
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://storage:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@db:5432/mlflow
      - --artifacts-destination
      - s3://mlflow-artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
